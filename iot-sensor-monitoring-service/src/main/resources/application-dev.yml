spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_sensors
    username: iot_user
    password: iot_pass

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

  jpa:
    show-sql: true

logging:
  level:
    com.smartcity.iot: DEBUG

app:
  simulation:
    enabled: true
    default-frequency-ms: 5000
