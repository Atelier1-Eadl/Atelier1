spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:iot_sensors}
    username: ${POSTGRES_USER:iot_user}
    password: ${POSTGRES_PASSWORD:iot_pass}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}

cloud:
  config:
    enabled: ${CONFIG_SERVER_ENABLED:false}
    uri: ${CONFIG_SERVER_URI:http://config-server:8888}

logging:
  level:
    com.smartcity.iot: INFO

app:
  simulation:
    enabled: true
    default-frequency-ms: 10000
