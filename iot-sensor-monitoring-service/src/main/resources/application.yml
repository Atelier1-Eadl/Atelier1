spring:
  application:
    name: iot-sensor-monitoring-service

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/iot_sensors
    username: iot_user
    password: iot_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.smartcity.iot: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN

app:
  simulation:
    enabled: true
    default-frequency-ms: 10000
    offline-threshold-seconds: 60
  kafka:
    topics:
      air-quality-telemetry: sensor.telemetry.air-quality
      traffic-telemetry: sensor.telemetry.traffic
      status-changed: sensor.status.changed
      alert: sensor.alert
  redis:
    sensor-status-ttl-seconds: 120

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

cloud:
  config:
    enabled: false
