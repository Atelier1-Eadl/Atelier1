spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  simulation:
    enabled: false
    offline-threshold-seconds: 30

eureka:
  client:
    enabled: false

cloud:
  config:
    enabled: false

logging:
  level:
    com.smartcity.iot: DEBUG
