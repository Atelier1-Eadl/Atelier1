name: IoT Sensor Monitoring - CI/CD

on:
  push:
    branches:
      - "feature/iot-sensor-monitoring-service"
    paths:
      - "iot-sensor-monitoring-service/**"
      - ".github/workflows/iot-sensor-monitoring-ci-cd.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "iot-sensor-monitoring-service/**"
  release:
    types: [published]

env:
  SERVICE_DIR: iot-sensor-monitoring-service
  IMAGE_NAME: iot-sensor-monitoring-service
  JAVA_VERSION: "21"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 : Build + Tests unitaires
  # ─────────────────────────────────────────────────────────────
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -B verify -Dgroups="!com.smartcity.iot.integration" -DexcludedGroups="integration" --no-transfer-progress

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ env.SERVICE_DIR }}/target/surefire-reports/
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ env.SERVICE_DIR }}/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2 : Tests d'intégration (Testcontainers + Docker)
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run integration tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -B verify -Dspring.profiles.active=test --no-transfer-progress
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ env.SERVICE_DIR }}/target/failsafe-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3 : Build Docker + Push vers GHCR et Artifactory
  # Déclenché sur : main, develop, ou release publiée
  # ─────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: integration-tests
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop'
      ))

    permissions:
      contents: read
      packages: write

    env:
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── GitHub Container Registry (GHCR) ───────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push to GHCR
        id: push-ghcr
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # ── JFrog Artifactory (si secrets ARTIFACTORY_* configurés) ──
      - name: Log in to Artifactory
        if: env.ARTIFACTORY_URL != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ARTIFACTORY_URL }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Extract metadata for Artifactory
        id: meta-artifactory
        if: env.ARTIFACTORY_URL != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ARTIFACTORY_URL }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push to Artifactory
        if: env.ARTIFACTORY_URL != ''
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          tags: ${{ steps.meta-artifactory.outputs.tags }}
          labels: ${{ steps.meta-artifactory.outputs.labels }}
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64

      - name: Image digest summary
        run: |
          echo "### Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ steps.push-ghcr.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # JOB 4 : Résumé du pipeline (toujours exécuté)
  # ─────────────────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, integration-tests, docker-build-push]
    if: always()

    steps:
      - name: Write pipeline summary
        run: |
          echo "## IoT Sensor Monitoring Service - Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Unit Tests | ${{ needs.build-and-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests  | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build/Push  | ${{ needs.docker-build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\` | **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
